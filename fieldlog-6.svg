<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="60" viewBox="0 0 1200 60"><style>text{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace}
